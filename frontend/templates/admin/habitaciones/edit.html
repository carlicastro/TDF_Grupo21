{% extends 'Components/base_admin.html' %}

{% block title %}Editar Habitación - Admin{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-8 mx-auto">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Editar Habitación: {{ hospedaje.nombre }}</h5>
      </div>
      <div class="card-body">
        <form action="{{ url_for('habitaciones.admin_editar', id=hospedaje.id_hospedaje) }}" method="POST">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="nombre" name="nombre" 
                       value="{{ hospedaje.nombre }}" placeholder="Ej: Suite Presidencial" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select class="form-select" id="tipo" name="tipo">
                  <option value="">Seleccionar tipo...</option>
                  <option value="habitacion" {{ 'selected' if hospedaje.tipo == 'habitacion' else '' }}>Habitación</option>
                  <option value="suite" {{ 'selected' if hospedaje.tipo == 'suite' else '' }}>Suite</option>
                  <option value="cabaña" {{ 'selected' if hospedaje.tipo == 'cabaña' else '' }}>Cabaña</option>
                  <option value="departamento" {{ 'selected' if hospedaje.tipo == 'departamento' else '' }}>Departamento</option>
                </select>
              </div>
            </div>
          </div>
          
          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" 
                      placeholder="Describe las características de la habitación...">{{ hospedaje.descripcion or '' }}</textarea>
          </div>
          
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="capacidad" class="form-label">Capacidad *</label>
                <select class="form-select" id="capacidad" name="capacidad" required>
                  <option value="">Seleccionar...</option>
                  <option value="1" {{ 'selected' if hospedaje.capacidad == 1 else '' }}>1 persona</option>
                  <option value="2" {{ 'selected' if hospedaje.capacidad == 2 else '' }}>2 personas</option>
                  <option value="4" {{ 'selected' if hospedaje.capacidad == 4 else '' }}>4 personas</option>
                  <option value="6" {{ 'selected' if hospedaje.capacidad == 6 else '' }}>6 personas</option>
                  <option value="8" {{ 'selected' if hospedaje.capacidad == 8 else '' }}>8+ personas</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="precio" class="form-label">Precio por noche ($) *</label>
                <input type="number" step="0.01" class="form-control" id="precio" name="precio" 
                       value="{{ hospedaje.precio }}" placeholder="150.00" min="0" required>
              </div>
            </div>
          </div>
          
          <div class="mb-3">
            <label for="foto" class="form-label">URL de Imagen (opcional)</label>
            <input type="url" class="form-control" id="foto" name="foto" 
                   value="{{ hospedaje.foto or '' }}" placeholder="https://example.com/imagen.jpg">
          </div>

          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="disponibilidad" name="disponibilidad" 
                     {{ 'checked' if hospedaje.disponibilidad == 1 else '' }}>
              <label class="form-check-label" for="disponibilidad">
                Habitación disponible
              </label>
            </div>
          </div>
          
          <div class="text-end">
            <a href="{{ url_for('habitaciones.admin_lista') }}" class="btn btn-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-warning">Actualizar Habitación</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
