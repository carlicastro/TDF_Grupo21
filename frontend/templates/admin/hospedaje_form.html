{% extends 'base.html' %}
{% block title %}Admin - Form hospedaje{% endblock %}
{% block content %}
<h1>Formulario hospedaje</h1>
<form action="" method="post">
  <label>Nombre: <input name="nombre"></label>
  <label>Descripción: <textarea name="descripcion"></textarea></label>
  <label>Capacidad: <input type="number" name="capacidad"></label>
  <label>Precio: <input type="number" step="0.01" name="precio"></label>
  <button type="submit">Guardar</button>
</form>
{% endblock %}
