{% extends 'base.html' %}
{% block title %}Consultar disponibilidad{% endblock %}
{% block content %}
<h1>Consultar disponibilidad</h1>
<form action="/reservas/checkout" method="get">
  <label>Check-in: <input type="date" name="checkin"></label>
  <label>Check-out: <input type="date" name="checkout"></label>
  <label>Pax: <input type="number" name="pax" min="1"></label>
  <button type="submit">Buscar</button>
</form>
{% endblock %}
