<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zxx">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %}Hotux Hotel{% endblock %}</title>
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.png') }}" />
    <!-- Bootstrap core CSS -->
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet" type="text/css" />
    <!--Default CSS-->
    <link href="{{ url_for('static', filename='css/default.css') }}" rel="stylesheet" type="text/css" />
    <!--Custom CSS-->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" type="text/css" />
    <!--Plugin CSS-->
    <link href="{{ url_for('static', filename='css/plugin.css') }}" rel="stylesheet" type="text/css" />
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css" />
    
    <!-- Estilos adicionales específicos de la página -->
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- Header component -->
    {% include 'Components/header.html' %}

    <!-- Breadcrumb section (opcional, puede ser sobrescrito) -->
    {% block breadcrumb %}
    {% endblock %}

    <!-- Contenido principal de la página -->
    <main>
      {% block content %}
      {% endblock %}
    </main>

    <!-- Footer component -->
    {% include 'Components/footer.html' %}

    <!-- Scripts base -->
    <script src="{{ url_for('static', filename='js/jquery-3.3.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/plugin.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom-nav.js') }}"></script>
    
    <!-- Scripts adicionales específicos de la página -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
